[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-data-engine"
version = "0.1.0"
description = "Small, fail-closed Polymarket Market, OrderFilled and Oracle data engine"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "web3>=7.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
market-data = "market_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
